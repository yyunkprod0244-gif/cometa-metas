<!doctype html>
<html lang="pt-BR" data-tema="escuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cometa — acompanhe suas metas etapa por etapa." />
    <meta name="theme-color" content="#0d0c12" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Cometa · Metas em órbita</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (evita "piscar")
      try {
        var salvo = localStorage.getItem('cometa:tema')
        var claro = window.matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.dataset.tema = salvo || (claro ? 'claro' : 'escuro')
      } catch (e) {
        /* localStorage indisponível: mantém o padrão */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
